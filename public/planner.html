<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>EleXa Total Solution Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0a1420;
    --bg-alt: #0e1a2b;
    --panel: #122238;
    --panel-2: #16283f;
    --line: #223752;
    --text: #e9eef7;
    --muted: #7f92ac;
    --muted-2: #5a6d88;
    --egat-navy: #0d2b5c;
    --elexa-gold: #f2b705;
    --elexa-gold-dim: #c99a1f;
    --done: #34d399;
    --progress: #f2b705;
    --notstarted: #35486a;
    --delayed: #f2694f;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1100px 500px at 100% -10%, rgba(242,183,5,0.07), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(13,43,92,0.5), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Sarabun', sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'JetBrains Mono', monospace;}

  .app{ display:grid; grid-template-columns:280px 1fr; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:linear-gradient(180deg, var(--bg-alt), var(--bg));
    border-right:1px solid var(--line);
    padding:20px 14px;
    display:flex; flex-direction:column; gap:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:2px 6px 10px; border-bottom:1px solid var(--line); }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg, var(--elexa-gold), #a97a06);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#1a1200;font-size:15px;flex:none;
    box-shadow:0 0 0 1px rgba(242,183,5,0.3), 0 4px 14px rgba(242,183,5,0.15);
  }
  .brand-text .t1{font-weight:700;font-size:14.5px;letter-spacing:.2px;}
  .brand-text .t2{font-size:11px;color:var(--muted);}

  .nav-group-label{
    font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1.2px;
    margin:2px 4px 2px; font-weight:600;
  }
  .nav-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--muted); font-size:13.5px; font-weight:500;
    transition:background .12s, color .12s;
  }
  .nav-item:hover{ background:var(--panel); color:var(--text); }
  .nav-item.active{ background:var(--panel-2); color:var(--text); box-shadow:inset 3px 0 0 var(--elexa-gold); }
  .nav-item .ico{ font-size:14px; width:16px; text-align:center; flex:none; }

  .proj-item{
    display:flex; flex-direction:column; gap:5px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    transition:background .12s;
  }
  .proj-item:hover{ background:var(--panel); }
  .proj-item.active{ background:var(--panel-2); box-shadow:inset 3px 0 0 var(--elexa-gold); }
  .proj-item .pi-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .proj-item .pi-name{ font-size:12.5px; color:var(--text); font-weight:500; line-height:1.3; }
  .proj-item .pi-pct{ font-size:11px; color:var(--elexa-gold); font-weight:700; flex:none; }
  .mini-bar{ height:4px; border-radius:3px; background:var(--notstarted); overflow:hidden; }
  .mini-bar > div{ height:100%; background:var(--elexa-gold); }

  /* ---------- Main ---------- */
  .main{ padding:26px 34px 60px; max-width:1300px; }
  .page-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:20px; }
  .page-header h1{ font-size:21px; margin:0 0 4px; letter-spacing:.2px; }
  .page-header .sub{ color:var(--muted); font-size:13px; }
  .today-chip{
    font-size:11.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    padding:6px 12px; border-radius:20px; white-space:nowrap;
  }

  /* Dashboard cards */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .stat-card .label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:8px; }
  .stat-card .value{ font-size:26px; font-weight:700; }
  .stat-card .value.gold{ color:var(--elexa-gold); }
  .stat-card .value.green{ color:var(--done); }
  .stat-card .value.red{ color:var(--delayed); }

  .section-title{ font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:26px 0 12px; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .proj-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
    cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .proj-card:hover{ border-color:var(--elexa-gold-dim); transform:translateY(-1px); }
  .proj-card .pc-id{ font-size:11px; color:var(--elexa-gold); font-weight:700; font-family:'JetBrains Mono',monospace; }
  .proj-card .pc-name{ font-size:14px; font-weight:600; margin:4px 0 2px; }
  .proj-card .pc-site{ font-size:12px; color:var(--muted); margin-bottom:2px;}
  .proj-card .pc-pkg{ font-size:11.5px; color:var(--muted-2); margin-bottom:12px; }
  .proj-card .pc-bar-row{ display:flex; align-items:center; gap:10px; }
  .proj-card .pc-bar{ flex:1; height:6px; border-radius:4px; background:var(--notstarted); overflow:hidden; }
  .proj-card .pc-bar > div{ height:100%; background:linear-gradient(90deg,var(--elexa-gold-dim),var(--elexa-gold)); }
  .proj-card .pc-pct{ font-size:12px; font-weight:700; color:var(--elexa-gold); width:38px; text-align:right; }
  .status-tags{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .tag{ font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; }
  .tag.done{ background:rgba(52,211,153,.14); color:var(--done); }
  .tag.progress{ background:rgba(242,183,5,.14); color:var(--elexa-gold); }
  .tag.delayed{ background:rgba(242,105,79,.14); color:var(--delayed); }
  .tag.notstarted{ background:rgba(90,109,136,.14); color:var(--muted); }

  /* Gantt */
  .gantt-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px 20px; overflow-x:auto; }
  .gantt-axis{ display:flex; margin-left:220px; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:10px; min-width:760px; position:relative; height:16px;}
  .gantt-axis .mon{ position:absolute; font-size:10.5px; color:var(--muted-2); transform:translateX(-50%); }
  .gantt-row{ display:flex; align-items:center; margin-bottom:10px; min-width:980px; }
  .gantt-row .g-label{ width:220px; flex:none; padding-right:14px; }
  .gantt-row .g-label .gl-name{ font-size:12px; font-weight:600; color:var(--text); line-height:1.3; }
  .gantt-row .g-label .gl-id{ font-size:10.5px; color:var(--elexa-gold); font-family:'JetBrains Mono',monospace; }
  .gantt-track{ position:relative; flex:1; height:26px; background:var(--panel-2); border-radius:6px; min-width:760px; }
  .gantt-seg{
    position:absolute; top:3px; height:20px; border-radius:4px;
    font-size:10px; color:#0a1420; font-weight:700; display:flex; align-items:center; padding-left:6px;
    overflow:hidden; white-space:nowrap; cursor:default; border:1px solid rgba(0,0,0,0.15);
  }
  .gantt-seg.done{ background:var(--done); }
  .gantt-seg.progress{ background:var(--elexa-gold); }
  .gantt-seg.notstarted{ background:var(--notstarted); color:var(--muted); }
  .gantt-seg.delayed{ background:var(--delayed); }
  .today-line{ position:absolute; top:-3px; bottom:-3px; width:2px; background:#ffffff; opacity:.55; }
  .today-line::after{ content:'วันนี้'; position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:9.5px; color:#fff; opacity:.8; white-space:nowrap; }
  .gantt-legend{ display:flex; gap:16px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .gantt-legend .lg-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); }
  .lg-swatch{ width:11px;height:11px;border-radius:3px; }

  /* Detail view */
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
  .detail-head .dh-id{ font-size:12px; color:var(--elexa-gold); font-weight:700; font-family:'JetBrains Mono',monospace; }
  .detail-head h2{ margin:4px 0 4px; font-size:19px; }
  .detail-head .dh-meta{ color:var(--muted); font-size:12.5px; }
  .ring{ width:64px; height:64px; flex:none; }

  table.phase-table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table.phase-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); padding:10px 12px; background:var(--panel-2); font-weight:600; border-bottom:1px solid var(--line); }
  table.phase-table td{ padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:12.5px; }
  table.phase-table tr:last-child td{ border-bottom:none; }
  table.phase-table tr:hover td{ background:rgba(255,255,255,0.015); }
  .ph-name{ font-weight:500; }
  select.st-select, input.dt-input, input.note-input{
    background:var(--bg-alt); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:5px 8px; font-size:12px; font-family:inherit;
  }
  select.st-select{ font-weight:600; }
  select.st-select.done{ color:var(--done); }
  select.st-select.progress{ color:var(--elexa-gold); }
  select.st-select.notstarted{ color:var(--muted); }
  select.st-select.delayed{ color:var(--delayed); }
  input.dt-input{ width:130px; color-scheme:dark; }
  input.note-input{ width:100%; min-width:140px; }
  .back-link{ color:var(--muted); font-size:12.5px; cursor:pointer; margin-bottom:14px; display:inline-block; }
  .back-link:hover{ color:var(--text); }
  .save-note{ font-size:11px; color:var(--muted-2); margin-top:10px; }
</style>
</head>

/* ============ STORAGE ============ */
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

function defaultPhasesFor(project){
  return SEED[project.id].map(row=>({ name:row[0], status:row[1], start:row[2], end:row[3], note:row[4] }));
}

// ข้อมูลทั้งหมดถูกเก็บไว้ใน Google Sheet ผ่าน Google Apps Script (Web App)
// แก้ URL ด้านล่างเป็น Web app URL ที่ได้จากการ Deploy Apps Script (ลงท้ายด้วย /exec)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtpf9aNev-BTCPj2WckvLukuZJHlrBnmOFnvo7O2mS_5wQpsKzfYA1pmbGX_cAJ8nq6A/exec';
async function fetchPlannerFromServer(){
  const res = await fetch(APPS_SCRIPT_URL, { method:'GET' });
  if(!res.ok) throw new Error('load failed: ' + res.status);
  return res.json();
}
async function savePlannerToServer(payload){
  // ใช้ Content-Type: text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script Web App ไม่รองรับ
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('save failed: ' + res.status);
  return res.json();
}

async function saveProject(id, phases){
  DATA[id] = phases;
  isSaving = true;
  try{ await savePlannerToServer({ version: SEED_VERSION, data: DATA }); }
  catch(e){ console.error('save failed', e); }
  finally{ isSaving = false; }
}

async function loadAll(){
  try{
    const remote = await fetchPlannerFromServer();
    if(remote && remote.version === SEED_VERSION && remote.data){
      DATA = remote.data;
      let missing = false;
      PROJECTS.forEach(p=>{
        if(!DATA[p.id]){ DATA[p.id] = defaultPhasesFor(p); missing = true; }
      });
      if(missing){ await savePlannerToServer({ version: SEED_VERSION, data: DATA }); }
      return;
    }
  }catch(e){ console.error('load failed, falling back to seed data', e); }

  DATA = {};
  PROJECTS.forEach(p=>{ DATA[p.id] = defaultPhasesFor(p); });
  try{ await savePlannerToServer({ version: SEED_VERSION, data: DATA }); }
  catch(e){ console.error('initial save failed', e); }
}


/* ============ HELPERS ============ */
function pct(phases){
  const done = phases.filter(p=>p.status==='done').length;
  return Math.round((done/phases.length)*100);
}
function statusCounts(phases){
  const c = {done:0,'in-progress':0,'not-started':0,delayed:0};
  phases.forEach(p=>c[p.status]++);
  return c;
}
function overallStats(){
  let totalPhases=0, done=0, delayed=0, inprog=0;
  PROJECTS.forEach(p=>{
    const ph = DATA[p.id];
    totalPhases += ph.length;
    ph.forEach(x=>{ if(x.status==='done')done++; if(x.status==='delayed')delayed++; if(x.status==='in-progress')inprog++; });
  });
  const avgPct = Math.round(PROJECTS.reduce((s,p)=>s+pct(DATA[p.id]),0)/PROJECTS.length);
  return {totalPhases, done, delayed, inprog, avgPct};
}

/* ============ RENDER: PORTFOLIO GANTT ============ */
function renderGantt(){
  // เส้นเวลาคงที่: มกราคม - ธันวาคม 2569 ตามที่กำหนด
  const minD = new Date('2026-01-01T00:00:00');
  const maxD = new Date('2026-12-31T00:00:00');
  const totalMs = maxD - minD;
  const todayPos = Math.min(100, Math.max(0, ((TODAY - minD)/totalMs)*100));

  // month tick marks
  let ticks = [];
  let cursor = new Date(minD.getFullYear(), minD.getMonth(), 1);
  while(cursor <= maxD){
    const posPct = ((cursor - minD)/totalMs)*100;
    ticks.push({ pos: Math.max(0,posPct), label: cursor.toLocaleDateString('th-TH',{month:'short', year:'2-digit'}) });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }

  let rows = '';
  PROJECTS.forEach(p=>{
    let segs = '';
    DATA[p.id].forEach(ph=>{
      const s = new Date(ph.start), e = new Date(ph.end);
      const left = Math.max(0, ((s-minD)/totalMs)*100);
      const rawWidth = ((e-s)/totalMs)*100;
      const width = Math.max(Math.min(rawWidth, 100-left), 0.6);
      const cls = STATUS[ph.status].cls;
      segs += `<div class="gantt-seg ${cls}" style="left:${left}%;width:${width}%" title="${ph.name}: ${ph.start} → ${ph.end} (${STATUS[ph.status].label})">${ph.name}</div>`;
    });
    rows += `
      <div class="gantt-row">
        <div class="g-label"><div class="gl-id">${p.id}</div><div class="gl-name">${p.name}</div></div>
        <div class="gantt-track">${segs}<div class="today-line" style="left:${todayPos}%"></div></div>
      </div>`;
  });

  let axisMarks = ticks.map(t=>`<div class="mon" style="left:${t.pos}%">${t.label}</div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="page-header">
      <div>
        <h1>แผนงานรวม (Portfolio Gantt)</h1>
        <div class="sub">ไทม์ไลน์รวมทุกโครงการ ตั้งแต่ ${minD.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'})} ถึง ${maxD.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'})}</div>
      </div>
      <div class="today-chip">วันนี้ &nbsp;${TODAY.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})}</div>
    </div>
    <div class="gantt-wrap">
      <div class="gantt-axis">${axisMarks}</div>
      ${rows}
      <div class="gantt-legend">
        <div class="lg-item"><span class="lg-swatch" style="background:var(--notstarted)"></span>ยังไม่เริ่ม</div>
        <div class="lg-item"><span class="lg-swatch" style="background:var(--elexa-gold)"></span>กำลังดำเนินการ</div>
        <div class="lg-item"><span class="lg-swatch" style="background:var(--done)"></span>เสร็จสิ้น</div>
        <div class="lg-item"><span class="lg-swatch" style="background:var(--delayed)"></span>ล่าช้า</div>
      </div>
    </div>
    <div class="save-note">คลิกที่แถบเพื่อดูช่วงวันที่ &middot; แก้ไขวันที่/สถานะได้ที่หน้ารายละเอียดโครงการ (เมนูด้านซ้าย)</div>
  `;
}

/* ============ AUTO-REFRESH (near real-time) ============ */
// ดึงข้อมูลใหม่จาก Google Sheet ทุก 20 วินาที เพื่อให้เห็นความเปลี่ยนแปลงจากคนอื่นโดยไม่ต้องกด reload เอง
// จะไม่ auto-refresh ทับขณะที่กำลังแก้ไขอยู่หน้ารายละเอียดโครงการ (state.view==='detail') เพื่อกันข้อมูลที่พิมพ์ค้างหาย
const AUTO_REFRESH_MS = 20000;
let isSaving = false;

async function autoRefresh(){
  if(state.view === 'detail' || isSaving) return; // อย่าไปแทรกตอนกำลังแก้ไข/บันทึกอยู่
  try{
    const remote = await fetchPlannerFromServer();
    if(remote && remote.data && Object.keys(remote.data).length){
      DATA = remote.data;
      renderAll();
    }
  }catch(e){ console.error('auto-refresh failed', e); }
}

(async function init(){
  document.getElementById('main').innerHTML = '<div style="padding:40px;color:var(--muted)">กำลังโหลดข้อมูลแผนงาน...</div>';
  await loadAll();
  renderAll();
  setInterval(autoRefresh, AUTO_REFRESH_MS);
})();
